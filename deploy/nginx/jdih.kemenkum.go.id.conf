# ILDIS production Nginx server block — Yii2 practical template
# Root: /mnt/data/ildis (frontend at /, admin at /backend/)
#
# Install:
#   sudo cp deploy/nginx/jdih.kemenkum.go.id.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/jdih.kemenkum.go.id.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Recommended global hardening in /etc/nginx/nginx.conf http {} block:
#   server_tokens off;
#   client_max_body_size 50m;  # also set per-server below

# =========================
# HTTP (main service)
# =========================
server {
    listen 80;
    listen [::]:80;
    server_name ildis-demo.bphn.go.id;

    root /var/www/ildis;
    index index.php;
    charset utf-8;

    access_log /var/log/nginx/ildis-demo-access.log;
    error_log  /var/log/nginx/ildis-demo-error.log;

    # Upload limit (50 MB — matches Apache LimitRequestBody)
    client_max_body_size 50m;

    # --- Canonical host: drop www ---
    if ($host = www.ildis-demo.bphn.go.id) {
        return 301 http://ildis-demo.bphn.go.id$request_uri;
    }

    # --- Security headers (aligned with Apache / docker config) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' http://cdn.jsdelivr.net https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com http://cdn.jsdelivr.net https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' https: data: https://fonts.gstatic.com; object-src 'none'; frame-ancestors 'self'" always;

    # Strip PHP version header (php-fpm fastcgi_hide_header)
    fastcgi_hide_header X-Powered-By;
    proxy_hide_header X-Powered-By;

    # --- Restrict HTTP methods ---
    # Allow only GET, POST, HEAD globally
    if ($request_method !~ ^(GET|POST|HEAD)$) {
        return 405;
    }

    # ===================================================
    # Block application internals (not web-facing)
    # ===================================================
    location ~ ^/(console|vendor|environments|backups|node_modules|schema|DATABASE|scripts|docker|vagrant|tests|\.git|\.github|\.devcontainer|\.idea|\.superpowers|\.agents|\.vscode)(/|$) {
        deny all;
        return 403;
    }

    # common/ holds app code; only common/dokumen/ is public attachment storage
    location ~ ^/common/(config|models|components|mail|tests|fixtures|widgets|uploads)(/|$) {
        deny all;
        return 403;
    }

    # Block bare /common/ listing
    location ~ ^/common/?$ {
        deny all;
        return 403;
    }

    # frontend/backend runtime and config dirs
    location ~ ^/(frontend|backend)/runtime(/|$) {
        deny all;
        return 403;
    }

    location ~ ^/(frontend|backend)/config(/|$) {
        deny all;
        return 403;
    }

    # --- Block dotfiles and sensitive root files ---
    location ~ /\. {
        deny all;
        return 403;
    }

    location ~ \.(bak|bat|config|sql|fla|md|psd|ini|log|sh|inc|swp|dist)$ {
        deny all;
        return 403;
    }

    location ~ ^/(yii|yii_test|requirements\.php|index-test\.php|composer\.(json|lock))$ {
        deny all;
        return 403;
    }

    # ===================================================
    # Deny ALL .php except the two Yii entry points
    # ===================================================
    # Any .php that isn't /index.php or /backend/index.php → 403
    location ~ \.php$ {
        deny all;
        return 403;
    }

    # ===================================================
    # Public document attachments — /common/dokumen/
    # ===================================================
    location ^~ /common/dokumen/ {
        # Read-only: only GET and HEAD
        limit_except GET HEAD {
            deny all;
        }

        # Block executable file extensions inside dokumen/
        location ~ \.(php|phtml|phar|cgi|sh|pl|py|exe|bat|sql|env|htaccess)$ {
            deny all;
            return 403;
        }

        # Disable directory listing
        autoindex off;
    }

    # ===================================================
    # Yii2 Frontend — / (pretty URLs)
    # ===================================================
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Frontend entry point
    location = /index.php {
        internal;  # only reachable via try_files, not directly
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }

    # ===================================================
    # Yii2 Backend — /backend/ (pretty URLs)
    # ===================================================
    # Trailing-slash redirect (matches Apache RedirectMatch)
    location = /backend {
        return 301 /backend/;
    }

    location /backend/ {
        try_files $uri $uri/ /backend/index.php$is_args$args;
    }

    # Backend entry point
    location = /backend/index.php {
        internal;  # only reachable via try_files, not directly
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }

    # ===================================================
    # Static asset caching
    # ===================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }
}